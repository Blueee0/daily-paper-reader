name: deep-reading-report
on:
  workflow_dispatch:
    inputs:
      routes:
        description: '已发布精读论文 route，每行或逗号分隔，最多20篇；只补内容，不重新检索评分'
        required: true
permissions:
  contents: write
concurrency:
  group: daily-paper-reader
  cancel-in-progress: false
jobs:
  reports:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DPR_MODELS_REMOTE_ONLY: '1'
      PYTHONUNBUFFERED: '1'
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.SUMMARY_API_KEY || secrets.DEEPSEEK_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.SUMMARY_BASE_URL || secrets.DEEPSEEK_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.SUMMARY_MODEL || secrets.DEEPSEEK_MODEL }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      REPORT_ROUTES: ${{ inputs.routes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v5
        with:
          path: .local-runs/deep-reading-cache/
          key: reports-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reports-v1-${{ github.ref_name }}-
      - name: Generate selected deep reports
        run: python scripts/backfill_deep_reports.py
      - name: Save report checkpoints
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .local-runs/deep-reading-cache/
          key: reports-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish selected reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m '[update] 补齐所选精读报告' -m 'Co-Authored-By: xixi <3495302215@qq.com>'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify existing Pages publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py --timeout 600
        # This workflow deliberately uses the existing branch-based Pages site.
        # It never changes the publishing configuration.
