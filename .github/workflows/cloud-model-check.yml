name: Verify cloud-only workflows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-model-check.yml'
      - '.github/workflows/daily-paper-reader.yml'
      - '.github/workflows/conference-paper-retrieval.yml'
      - '.github/workflows/starter-pack.yml'
      - '.github/workflows/topic-research.yml'
      - 'src/model_loader.py'
      - 'src/long_range_review.py'
      - 'src/starter_pack*.py'
      - 'src/topic_*.py'
      - 'app/topic-*.js'
      - 'tests/test_topic*'
      - 'src/paper_dates.py'
      - 'src/paper_dedupe.py'
      - 'src/deep_reading.py'
      - 'src/literature_evidence.py'
      - 'scripts/backfill_deep_reports.py'
      - '.github/workflows/deep-reading-report.yml'
      - 'app/deep-reading-report.js'
      - 'app/app.css'
      - 'tests/test_deep_reading_report*'
      - 'tests/test_pipeline_stages.py'
      - 'tests/test_workflow_schedule.js'
      - 'tests/test_secret_and_reset_recovery.js'
      - 'src/3.rank_papers.py'
      - 'scripts/check_cloud_models.py'
      - 'scripts/request_pages_build.py'
      - 'requirements.txt'
      - 'tests/test_cloud_models.py'
      - 'tests/test_starter_pack*'
      - 'tests/test_paper_dates.py'
      - 'tests/test_paper_dedupe.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install lightweight runtime and tests
        run: python -m pip install -r requirements.txt pytest pytest-subtests
      - name: Python regression in clean environment
        run: timeout 60 python -m pytest -q
      - name: JavaScript regression
        run: |
          set -euo pipefail
          for test in tests/test_*.js; do
            timeout 60 node "$test"
          done
      - name: Real cloud embedding and reranker smoke
        env:
          DPR_MODELS_REMOTE_ONLY: '1'
          DPR_EMBED_ALLOW_LOCAL_FALLBACK: '0'
          DPR_EMBED_API_URL: ${{ secrets.DPR_EMBED_API_URL || 'https://zwwen.online/embed' }}
          DPR_EMBED_API_KEY: ${{ secrets.DPR_EMBED_API_KEY }}
          RERANK_PROFILE: public-zwwen-rerank
          PUBLIC_RERANK_API_BASE_URL: ${{ secrets.PUBLIC_RERANK_API_BASE_URL || 'https://zwwen.online/rerank' }}
          PUBLIC_RERANK_API_KEY: ${{ secrets.PUBLIC_RERANK_API_KEY }}
        run: python scripts/check_cloud_models.py --require-lightweight
      - name: Real twelve-section report smoke
        env:
          DPR_MODELS_REMOTE_ONLY: '1'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.SUMMARY_API_KEY || secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || secrets.SUMMARY_BASE_URL || secrets.DEEPSEEK_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || secrets.SUMMARY_MODEL || secrets.DEEPSEEK_MODEL }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          python - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from llm import ClientFactory
          from deep_reading import generate_report
          if not os.getenv('LLM_API_KEY'):
              raise SystemExit('缺少工作流 LLM Key，未执行付费报告验证。')
          output = Path(os.environ['RUNNER_TEMP']) / 'reader-report-smoke'
          output.mkdir()
          source = Path('docs_init/201706/12/1706.03762v1-attention-is-all-you-need')
          for suffix in ('.md', '.txt'):
              shutil.copyfile(str(source) + suffix, output / ('paper' + suffix))
          client = ClientFactory.from_env()
          report = generate_report(output / 'paper.md', output / 'paper.txt', client, max_attempts=2)
          assert '## 12.' in report and '## 参考资料' in report
          client.chat = lambda **_: (_ for _ in ()).throw(AssertionError('unexpected repeated model call'))
          assert generate_report(output / 'paper.md', output / 'paper.txt', client) == report
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('单篇全文、文献检索、十二节报告与已发布结果复用验证完成。\n')
          PY
      - name: Upload report smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-report-smoke
          path: ${{ runner.temp }}/reader-report-smoke/
          if-no-files-found: ignore
          retention-days: 7
